name: BoxCall
options:
  bundleIdPrefix: com.boxcall
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, es, Base]
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: "UDM4W27W9V"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BoxCall:
    type: application
    platform: iOS
    sources:
      - path: BoxCall
        excludes:
          - Products.storekit
    dependencies:
      - sdk: StoreKit.framework
      - sdk: UserNotifications.framework
      - sdk: AuthenticationServices.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: CoreHaptics.framework
      - target: BoxCallWidget
      - target: BoxCallWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boxcall.app
        # Sign in with Apple fails with AuthorizationError 1000 without
        # this, and the widget's shared container returns nil.
        CODE_SIGN_ENTITLEMENTS: BoxCall/BoxCall.entitlements
        # Answered up front so every upload stops asking. The app only
        # talks HTTPS, which is exempt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: "BoxCall"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: '"BoxCall/Preview Content"'
  BoxCallWidget:
    type: app-extension
    platform: iOS
    info:
      path: BoxCallWidget/Info.plist
      properties:
        CFBundleDisplayName: BoxCall
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: BoxCallWidget
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boxcall.app.widget
        CODE_SIGN_ENTITLEMENTS: BoxCallWidget/BoxCallWidget.entitlements
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_CFBundleDisplayName: "BoxCall"
  BoxCallWatch:
    type: application
    platform: watchOS
    deploymentTarget:
      watchOS: "10.0"
    sources:
      - path: BoxCallWatch
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WatchConnectivity.framework
      - target: BoxCallWatchComplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boxcall.app.watchkitapp
        # The watch app needs its own icon or the archive will not
        # validate, even though it ships inside the iOS submission.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: BoxCallWatch/Info.plist
        # NOTE: no CODE_SIGN_ENTITLEMENTS here on purpose. The watch app's
        # app-group membership isn't assignable via the ASC API (portal
        # GUI only) and the wildcard team profile can't carry app groups.
        # The sync fix needs NO app group: WatchBridge decodes the WCSession
        # payload directly; cold starts read the WCSession inbox
        # (receivedApplicationContext), which persists without one. The
        # app-group cache in WatchBridge no-ops (suiteName returns nil)
        # until the group is assigned to this bundle ID via the portal.
  BoxCallWatchComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget:
      watchOS: "10.0"
    sources:
      - path: BoxCallWatchComplication
      - path: BoxCallWatch/WatchBridge.swift
    info:
      path: BoxCallWatchComplication/Info.plist
      properties:
        CFBundleDisplayName: BoxCall
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boxcall.app.watchkitapp.boxcallcomplication
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # No entitlements — same app-group story as the watch app target:
        # group assignment is portal-GUI-only; the complication reads
        # WatchBridge's in-process snapshot, which needs no group.
  BoxCallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BoxCallTests
    dependencies:
      - target: BoxCall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boxcall.app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BoxCall.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BoxCall"
schemes:
  BoxCall:
    build:
      targets:
        BoxCall: all
        BoxCallWidget: all
        BoxCallWatch: all
        BoxCallWatchComplication: all
        BoxCallTests: [test]
    run:
      config: Debug
      storeKitConfiguration: BoxCall/Products.storekit
    test:
      config: Debug
      targets:
        - BoxCallTests
