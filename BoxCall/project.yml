name: BoxCall
options:
  bundleIdPrefix: com.boxcall
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, es, Base]
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "UDM4W27W9V"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BoxCall:
    type: application
    platform: iOS
    sources:
      - path: BoxCall
        excludes:
          - Products.storekit
    dependencies:
      - sdk: StoreKit.framework
      - sdk: UserNotifications.framework
      - sdk: AuthenticationServices.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: CoreHaptics.framework
      - target: BoxCallWidget
      - target: BoxCallWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boxcall.app
        CODE_SIGN_ENTITLEMENTS: BoxCall/BoxCall.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "BoxCall"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: '"BoxCall/Preview Content"'
  BoxCallWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BoxCallWidget
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boxcall.app.widget
        CODE_SIGN_ENTITLEMENTS: BoxCallWidget/BoxCallWidget.entitlements
        INFOPLIST_FILE: BoxCallWidget/Info.plist
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_CFBundleDisplayName: "BoxCall"
  BoxCallWatch:
    type: application
    platform: watchOS
    deploymentTarget:
      watchOS: "10.0"
    sources:
      - path: BoxCallWatch
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WatchConnectivity.framework
      - target: BoxCallWatchComplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boxcall.app.watchkitapp
        INFOPLIST_FILE: BoxCallWatch/Info.plist
  BoxCallWatchComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget:
      watchOS: "10.0"
    sources:
      - path: BoxCallWatchComplication
      - path: BoxCallWatch/WatchBridge.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boxcall.app.watchkitapp.complication
        INFOPLIST_FILE: BoxCallWatchComplication/Info.plist
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
  BoxCallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BoxCallTests
    dependencies:
      - target: BoxCall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boxcall.app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BoxCall.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BoxCall"
schemes:
  BoxCall:
    build:
      targets:
        BoxCall: all
        BoxCallWidget: all
        BoxCallWatch: all
        BoxCallWatchComplication: all
        BoxCallTests: [test]
    run:
      config: Debug
      storeKitConfiguration: BoxCall/Products.storekit
    test:
      config: Debug
      targets:
        - BoxCallTests
