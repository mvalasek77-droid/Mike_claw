name: BoxCall
options:
  bundleIdPrefix: com.boxcall
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BoxCall:
    type: application
    platform: iOS
    sources:
      - path: BoxCall
    dependencies:
      - sdk: StoreKit.framework
      - sdk: UserNotifications.framework
      - sdk: AuthenticationServices.framework
      - sdk: WidgetKit.framework
      - target: BoxCallWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boxcall.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: '"BoxCall/Preview Content"'
  BoxCallWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BoxCallWidget
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boxcall.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: "BoxCall"
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  BoxCall:
    build:
      targets:
        BoxCall: all
        BoxCallWidget: all
    run:
      config: Debug
      storeKitConfiguration: BoxCall/Products.storekit
