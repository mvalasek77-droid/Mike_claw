name = "auctionbaby-auth"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# ── Secrets (never committed) — set once with `wrangler secret put <NAME>`: ──
#   SESSION_SECRET       long random string used to HMAC-sign session tokens.
#                        ROTATING THIS INVALIDATES EVERY EXISTING SESSION.
#   APP_SHARED_SECRET    gates the admin push-send endpoint (POST /push/send).
#                        Same convention as the other Workers so ops uses ONE
#                        secret across every backend.
#   APNS_AUTH_KEY_P8     Apple Push Auth Key contents (multi-line PEM,
#                        -----BEGIN PRIVATE KEY-----…). Get this .p8 from
#                        Apple Developer → Keys → + → APNs. Upload it via:
#                          wrangler secret put APNS_AUTH_KEY_P8 < AuthKey_XXXX.p8
#                        Apple lets you have max 2 active keys — rotate by
#                        putting the new secret, then revoking the old on Apple.
#   APNS_KEY_ID          10-char id printed alongside the .p8 (e.g. "ABC123DEFG")
#   APNS_TEAM_ID         Your 10-char Apple Developer team id
#
# The Apple IDENTITY JWT is verified against Apple's PUBLIC JWKS
# (https://appleid.apple.com/auth/keys) — no client-secret needed for that.
# The APNs JWT we SEND is signed with the .p8 above (ES256).

[vars]
# The app's bundle id, checked as the `aud` claim on the Apple identity JWT
# AND used as the `apns-topic` on push sends. If it doesn't match either,
# both flows fail — this is the single check that guarantees a token wasn't
# issued to (or a push wasn't intended for) a different app.
APPLE_CLIENT_ID = "com.valasek.auctionbaby"
# JWTs older than SESSION_TTL_SECONDS are rejected. Balance UX (long enough
# that users don't re-auth constantly) against blast radius on a leaked token.
# Default: 30 days.
SESSION_TTL_SECONDS = "2592000"
# Public base URL for the R2 photos bucket. Set to your r2.dev subdomain
# (e.g. https://pub-abc123.r2.dev) OR a custom domain fronting the bucket.
# Photo URLs returned to clients are this + "/" + object key. Leave empty
# to disable the photo upload endpoints; the app already tolerates no
# photos and shows the monogram fallback.
PHOTOS_PUBLIC_URL = ""

# D1: the users table. `wrangler d1 create auctionbaby-users` gives you an id;
# paste it in below. Schema lives in ./schema.sql — apply it with:
#   wrangler d1 execute auctionbaby-users --file=schema.sql
# ⚠️  MUST BE REPLACED BEFORE FIRST DEPLOY.
[[d1_databases]]
binding = "DB"
database_name = "auctionbaby-users"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# R2: profile photo bytes. Provision with:
#   wrangler r2 bucket create auctionbaby-photos
# Then enable public access (dashboard → the bucket → Settings → Public
# access) and paste the r2.dev subdomain into PHOTOS_PUBLIC_URL above.
# Optional but recommended: attach a custom domain for a stable CDN URL.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "auctionbaby-photos"

# ── STAGING (test bundle id / test database) ─────────────────────────────────
# Deploy: `wrangler deploy --env staging`
[env.staging]
name = "auctionbaby-auth-staging"

[env.staging.vars]
APPLE_CLIENT_ID = "com.valasek.auctionbaby"
SESSION_TTL_SECONDS = "2592000"
PHOTOS_PUBLIC_URL = ""

# Same rule: create a staging DB and paste it here.
#   wrangler d1 create auctionbaby-users-staging
[[env.staging.d1_databases]]
binding = "DB"
database_name = "auctionbaby-users-staging"
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"

# Staging R2 bucket (recommended so a staging test upload can't polluted the
# prod bucket). Create with:
#   wrangler r2 bucket create auctionbaby-photos-staging
[[env.staging.r2_buckets]]
binding = "PHOTOS"
bucket_name = "auctionbaby-photos-staging"
