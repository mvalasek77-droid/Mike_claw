name: AuctionBaby

options:
  bundleIdPrefix: com.valasek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: "UDM4W27W9V"

targets:
  AuctionBaby:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # Registered bundle IDs are lowercase on the Developer Portal.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valasek.auctionbaby
        INFOPLIST_FILE: AuctionBaby/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Wire the entitlements file so Sign in with Apple + Push actually make
        # it into the signed binary. Without this, XcodeGen emits no
        # CODE_SIGN_ENTITLEMENTS and the app ships with only the three default
        # entitlements — which is why the SIWA sheet never appeared.
        CODE_SIGN_ENTITLEMENTS: AuctionBaby/AuctionBaby.entitlements
      configs:
        # aps-environment in the entitlements reads $(APS_ENVIRONMENT):
        # development for local/dev builds, production for TestFlight/App Store.
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    configFiles:
      Debug: Config/Build.xcconfig
      Release: Config/Build.xcconfig
    sources:
      - path: AuctionBaby

  AuctionBabyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AuctionBabyTests
        excludes:
          - "README.md"
      - path: Products.storekit
        buildPhase: resources
    dependencies:
      - target: AuctionBaby
      - sdk: StoreKitTest.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.valasek.auctionbaby.tests

  AuctionBabyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AuctionBabyUITests
    dependencies:
      - target: AuctionBaby
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.valasek.auctionbaby.uitests
        TEST_TARGET_NAME: AuctionBaby

schemes:
  AuctionBaby:
    build:
      targets:
        AuctionBaby: all
        AuctionBabyTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    test:
      config: Debug
      storeKitConfiguration: Products.storekit
      targets:
        - AuctionBabyTests
        - AuctionBabyUITests
    archive:
      config: Release
