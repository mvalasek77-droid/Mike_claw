name: PromptCoach
options:
  bundleIdPrefix: com.codegenie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    GENERATE_INFOPLIST_FILE: NO
targets:
  PromptCoach:
    type: application
    platform: iOS
    sources:
      - path: PromptCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codegenie.promptcoach
        INFOPLIST_FILE: PromptCoach/Resources/Info.plist
