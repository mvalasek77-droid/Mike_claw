<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Sicking That Thing Cover</title>
<script>p5.disableFriendlyErrors = true;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<style>html,body{margin:0;padding:0;overflow:hidden}canvas{display:block}</style>
</head><body><script>
function setup() {
  createCanvas(1000, 1500);
  pixelDensity(1);
  randomSeed(88);
  noiseSeed(88);
  noLoop();
}
function draw() {
  colorMode(HSB, 360, 100, 100, 100);
  background(0, 0, 3);
  // Dark urban gradient
  for (let y = 0; y < height; y++) {
    let t = y / height;
    stroke(240 + t*20, lerp(20, 40, t), lerp(10, 3, t));
    line(0, y, width, y);
  }
  // Neon geometric shapes
  noStroke();
  for (let i = 0; i < 40; i++) {
    let cx = random(width);
    let cy = random(height);
    let sz = random(30, 200);
    let hue = random() > 0.6 ? 340 : (random() > 0.5 ? 200 : 170);
    push();
    translate(cx, cy);
    rotate(random(TWO_PI));
    fill(hue, random(60, 100), random(50, 90), random(8, 25));
    if (random() > 0.5) {
      rect(0, 0, sz, sz * random(0.3, 2));
    } else {
      ellipse(0, 0, sz, sz * random(0.5, 1.5));
    }
    // Neon edge glow
    noFill();
    stroke(hue, 90, 90, random(15, 40));
    strokeWeight(random(0.5, 2));
    if (random() > 0.5) rect(0, 0, sz, sz * random(0.3, 2));
    else ellipse(0, 0, sz, sz * random(0.5, 1.5));
    pop();
  }
  // Central glow
  for (let r = 350; r > 0; r -= 4) {
    let t = r / 350;
    fill(200, lerp(50, 100, 1-t), lerp(20, 70, 1-t), lerp(3, 20, 1-t));
    ellipse(width/2, height*0.45, r*1.1, r);
  }
  // Horizontal neon lines
  for (let i = 0; i < 15; i++) {
    let y = random(height);
    strokeWeight(random(0.3, 1.5));
    let hue = random() > 0.7 ? 340 : 200;
    stroke(hue, 80, 90, random(20, 60));
    let x1 = random(width * 0.1, width * 0.4);
    let x2 = random(width * 0.6, width * 0.9);
    line(x1, y, x2, y);
  }
  // Particle dots
  for (let i = 0; i < 300; i++) {
    fill(random() > 0.5 ? color(340, 80, 90) : color(200, 70, 80), random(10, 40));
    ellipse(random(width), random(height), random(1, 4));
  }
  // Vignette
  for (let r = 0; r < 80; r++) {
    noFill();
    stroke(0, 0, 3, map(r, 0, 80, 30, 0));
    strokeWeight(20);
    rect(-10+r*0.5, -10+r*0.5, width+20-r, height+20-r*1.3);
  }
  saveCanvas('sicking-that-thing', 'png');
}
</script></body></html>
