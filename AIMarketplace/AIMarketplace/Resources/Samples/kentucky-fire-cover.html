<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Kentucky Fire Cover</title>
<script>p5.disableFriendlyErrors = true;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<style>html,body{margin:0;padding:0;overflow:hidden}canvas{display:block}</style>
</head><body><script>
function setup() {
  createCanvas(1000, 1500);
  pixelDensity(1);
  randomSeed(77);
  noiseSeed(77);
  noLoop();
}
function draw() {
  colorMode(HSB, 360, 100, 100, 100);
  background(25, 80, 8);
  // Amber gradient background
  for (let y = 0; y < height; y++) {
    let t = y / height;
    let h = lerp(35, 15, t);
    let s = lerp(60, 85, t);
    let b = lerp(18, 5, t);
    stroke(h, s, b);
    line(0, y, width, y);
  }
  // Whiskey glass glow center
  noStroke();
  for (let r = 400; r > 0; r -= 3) {
    let t = r / 400;
    fill(38, lerp(40, 90, 1-t), lerp(15, 55, 1-t), lerp(5, 30, 1-t));
    ellipse(width/2, height*0.42, r*1.2, r);
  }
  // Flame wisps
  for (let i = 0; i < 60; i++) {
    let x = width/2 + random(-120, 120);
    let baseY = height * 0.35 + random(-80, 30);
    let len = random(50, 200);
    strokeWeight(random(0.5, 3));
    stroke(random(15,50), random(70,100), random(60,100), random(15,50));
    let nx = x;
    for (let j = 0; j < len; j += 2) {
      let ny = baseY - j;
      nx += random(-3, 3);
      point(nx, ny);
    }
  }
  // Smoke curls (upper portion)
  for (let i = 0; i < 80; i++) {
    let sx = width/2 + random(-100, 100);
    let sy = random(50, height*0.25);
    let sz = random(30, 120);
    noStroke();
    fill(25, 20, random(15, 30), random(5, 18));
    ellipse(sx, sy, sz, sz * random(1.5, 3));
  }
  // Cobweb lace texture overlay
  stroke(38, 30, 90, 4);
  strokeWeight(0.5);
  for (let i = 0; i < 200; i++) {
    let x1 = random(width), y1 = random(height);
    let angle = random(TWO_PI);
    let len = random(20, 80);
    line(x1, y1, x1 + cos(angle)*len, y1 + sin(angle)*len);
  }
  // Gold specks
  noStroke();
  for (let i = 0; i < 200; i++) {
    fill(42, random(60,100), random(70,100), random(15, 50));
    let sz = random(1, 5);
    ellipse(random(width), random(height), sz, sz);
  }
  // Vignette
  for (let r = 0; r < 80; r++) {
    noFill();
    stroke(20, 80, 5, map(r, 0, 80, 25, 0));
    strokeWeight(20);
    rect(-10+r*0.5, -10+r*0.5, width+20-r, height+20-r*1.3);
  }
  saveCanvas('kentucky-fire', 'png');
}
</script></body></html>
