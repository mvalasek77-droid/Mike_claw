name: AIMarketplace

options:
  bundleIdPrefix: com.valasek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: "UDM4W27W9V"

targets:
  AIMarketplace:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # Build config: pulls AIMKT_WORKER_URL + AIMKT_SHARED_SECRET from
    # Config/Build.xcconfig, which optionally loads Config/Secrets.xcconfig
    # (gitignored). Info.plist substitutes those into bundle keys at build
    # time; BackendConfig reads them at runtime. Missing Secrets.xcconfig
    # is fine — empty values mean "no Worker baked in; admin configures
    # at runtime."
    configFiles:
      Debug: Config/Build.xcconfig
      Release: Config/Build.xcconfig
    sources:
      - path: AIMarketplace
        excludes:
          - "Resources/Samples/README.md"
  AIMarketplaceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AIMarketplaceTests
        excludes:
          - "README.md"
      - path: Products.storekit
    dependencies:
      - target: AIMarketplace
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.valasek.aimarketplace.tests

schemes:
  AIMarketplace:
    build:
      targets:
        AIMarketplace: all
        AIMarketplaceTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    test:
      config: Debug
      storeKitConfiguration: Products.storekit
      targets:
        - AIMarketplaceTests
    archive:
      config: Release