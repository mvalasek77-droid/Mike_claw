name = "aimarketplace-payout"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Secrets (never committed) — set once with `wrangler secret put <NAME>`:
#   STRIPE_SECRET_KEY        sk_live_… (or sk_test_… while testing)
#   STRIPE_WEBHOOK_SECRET    whsec_… from the Stripe webhook endpoint you create
#   STRIPE_PUBLISHABLE_KEY   pk_live_… (optional; not used server-side today,
#                            served via GET /stripe/publishable-key for any
#                            future client-side Stripe.js / Elements flow)
#   APP_SHARED_SECRET        long random string; also pasted into the app
#   RESEND_API_KEY           (optional) enables the operator payout-digest email
#   ANTHROPIC_API_KEY        (optional) enables /scout/draft — the Scout's text
#                            drafting fallback for devices without Apple
#                            Intelligence. Get one at console.anthropic.com.
#                            Model defaults to claude-opus-4-8; override with
#                            the SCOUT_TEXT_MODEL var if desired.

[vars]
STRIPE_CONNECT_TYPE = "express"
# Platform Stripe account is Canadian — settle transfers/payouts in CAD and
# default new creator accounts to CA (the app can override country per creator).
PLATFORM_CURRENCY = "cad"
PLATFORM_COUNTRY = "CA"
# Where ALL operator mail goes — routine payout digest AND critical NSF /
# payout-failure alerts (ALERT_EMAIL defaults to this, so it's one inbox).
OPERATOR_EMAIL = "mvalasek77@gmail.com"
# ALERT_EMAIL = "mvalasek77@gmail.com"   # uncomment only to split alerts out
# DIGEST_FROM_EMAIL = "payouts@yourdomain.com"   # set once your domain is verified
TOPUP_BUFFER_USD = "100"
# Hard cap per top-up; a refund storm can otherwise trigger a large bank pull.
TOPUP_MAX_USD = "200"
# Optional: ba_… of the bank source Stripe should pull from (required only if
# your platform account has multiple verified Top-up sources).
# TOPUP_SOURCE_ID = "ba_xxx"

# Scout media generation (audio/video). All optional. Without API keys set,
# /scout/generate-media returns provider:"none" and the app falls back to
# the on-device prose-as-artifact path. With keys, the Worker forwards
# prompts to the provider and tracks per-month spend in KV.
# MUSIC_GEN_API_URL = "https://api.suno.example/generate"
# MUSIC_GEN_API_KEY = "set via: wrangler secret put MUSIC_GEN_API_KEY"
# VIDEO_GEN_API_URL = "https://api.runway.example/generate"
# VIDEO_GEN_API_KEY = "set via: wrangler secret put VIDEO_GEN_API_KEY"
MAX_MEDIA_GEN_USD_MONTH = "50"
MUSIC_GEN_COST_USD = "0.15"
VIDEO_GEN_COST_USD = "0.60"

# KV: canonical creator email→accountId map + last webhook-observed payout
# state + Scout media-gen monthly spend tracking.
[[kv_namespaces]]
binding = "KV"
id = "1cacf9975f7a44a5b8f2f3da607e5c3f"

# Cron: every 6 hours, fund the float then email the payout digest.
[triggers]
crons = ["0 */6 * * *"]

# ── STAGING (Stripe test mode / fake money) ──────────────────────────────────
# Deploy: npx wrangler deploy --env staging   •   Worker: aimarketplace-payout-staging
# Set test secrets with `--env staging`. Independent KV + secrets from prod.
[env.staging]
name = "aimarketplace-payout-staging"

[env.staging.vars]
STRIPE_CONNECT_TYPE = "express"
PLATFORM_CURRENCY = "cad"
PLATFORM_COUNTRY = "CA"
OPERATOR_EMAIL = "mvalasek77@gmail.com"
TOPUP_BUFFER_USD = "100"
TOPUP_MAX_USD = "200"
MAX_MEDIA_GEN_USD_MONTH = "50"
MUSIC_GEN_COST_USD = "0.15"
VIDEO_GEN_COST_USD = "0.60"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "adc2726df6874d31955c91a704214fb8"