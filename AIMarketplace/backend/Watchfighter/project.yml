name: Watchfighter

options:
  bundleIdPrefix: com.valasek
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Watchfighter:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watchfighter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valasek.watchfighter
        PRODUCT_MODULE_NAME: Watchfighter
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        DEVELOPMENT_TEAM: "UDM4W27W9V"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Watchfighter
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  WatchfighterTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchfighterTests
    dependencies:
      - target: Watchfighter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valasek.watchfighter.tests
        PRODUCT_MODULE_NAME: WatchfighterTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Watchfighter:
    build:
      targets:
        Watchfighter: all
        WatchfighterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WatchfighterTests
    archive:
      config: Release
