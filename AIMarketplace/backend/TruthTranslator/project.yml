name: TruthTranslator

options:
  bundleIdPrefix: com.chaddrop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

targets:
  TruthTranslator:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TruthTranslator
        excludes:
          - Resources/Assets.xcassets/AppIcon.appiconset/README.md
    info:
      path: TruthTranslator/Resources/Info.plist
      properties:
        CFBundleDisplayName: ChadDrop
        CFBundleName: ChadDrop
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        AI_PROXY_URL: "$(AI_PROXY_URL)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaddrop.app
        PRODUCT_NAME: TruthTranslator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 ChadDrop"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

  TruthTranslatorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TruthTranslatorTests
    dependencies:
      - target: TruthTranslator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaddrop.app.tests

  TruthTranslatorUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TruthTranslatorUITests
    dependencies:
      - target: TruthTranslator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaddrop.app.uitests

schemes:
  TruthTranslator:
    build:
      targets:
        TruthTranslator: all
        TruthTranslatorTests: [test]
        TruthTranslatorUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TruthTranslatorTests
        - TruthTranslatorUITests
      gatherCoverageData: true
    archive:
      config: Release
