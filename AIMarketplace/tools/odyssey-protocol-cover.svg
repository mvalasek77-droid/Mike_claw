<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="deepSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020a15"/>
      <stop offset="25%" stop-color="#071e3d"/>
      <stop offset="55%" stop-color="#0a2a4a"/>
      <stop offset="80%" stop-color="#061a30"/>
      <stop offset="100%" stop-color="#010810"/>
    </linearGradient>
    <radialGradient id="lightSource" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#0D47A1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020a15" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vesselLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#FFA000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="50%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#4FC3F7"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#FFC107" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFC107" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="medGlow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <!-- Water ripple pattern -->
    <pattern id="ripple" x="0" y="0" width="200" height="30" patternUnits="userSpaceOnUse">
      <path d="M0,15 Q50,5 100,15 Q150,25 200,15" fill="none" stroke="#4FC3F7" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Deep ocean background -->
  <rect width="1000" height="1500" fill="url(#deepSea)"/>

  <!-- Light from above (moonlight through water) -->
  <ellipse cx="500" cy="500" rx="500" ry="400" fill="url(#lightSource)" filter="url(#bigGlow)"/>

  <!-- Surface light shafts -->
  <g opacity="0.06">
    <polygon points="350,0 380,600 420,600" fill="#81D4FA"/>
    <polygon points="480,0 510,650 540,650" fill="#4FC3F7"/>
    <polygon points="600,0 630,550 660,550" fill="#81D4FA"/>
    <polygon points="250,0 270,500 290,500" fill="#B3E5FC"/>
    <polygon points="720,0 740,520 760,520" fill="#B3E5FC"/>
  </g>

  <!-- Stars scattered in the dark sky portion (top 400px) -->
  <g fill="#FFFFFF">
    <circle cx="80" cy="50" r="1" opacity="0.6"/>
    <circle cx="200" cy="120" r="1.3" opacity="0.5"/>
    <circle cx="350" cy="80" r="0.8" opacity="0.7"/>
    <circle cx="480" cy="40" r="1.5" opacity="0.4"/>
    <circle cx="620" cy="100" r="1" opacity="0.6"/>
    <circle cx="780" cy="60" r="1.2" opacity="0.5"/>
    <circle cx="900" cy="130" r="0.8" opacity="0.7"/>
    <circle cx="150" cy="180" r="1" opacity="0.3"/>
    <circle cx="700" cy="170" r="0.7" opacity="0.4"/>
    <circle cx="400" cy="150" r="1.1" opacity="0.5"/>
    <circle cx="550" cy="200" r="0.9" opacity="0.3"/>
    <circle cx="850" cy="190" r="1" opacity="0.4"/>
  </g>

  <!-- Central bright star (Odysseus' guide star) - DRAMATIC -->
  <circle cx="500" cy="140" r="6" fill="#FFD700" opacity="0.9" filter="url(#glow)"/>
  <g filter="url(#softGlow)" opacity="0.5">
    <line x1="500" y1="105" x2="500" y2="175" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="465" y1="140" x2="535" y2="140" stroke="#FFD700" stroke-width="1.5"/>
    <line x1="478" y1="118" x2="522" y2="162" stroke="#FFD700" stroke-width="0.8"/>
    <line x1="522" y1="118" x2="478" y2="162" stroke="#FFD700" stroke-width="0.8"/>
  </g>
  <!-- Star halo -->
  <circle cx="500" cy="140" r="40" fill="#FFD700" opacity="0.03" filter="url(#medGlow)"/>

  <!-- The Aegean Sea - dramatic surface waves -->
  <g opacity="0.12">
    <path d="M-50,400 Q100,370 200,400 Q300,430 400,395 Q500,365 600,395 Q700,425 800,395 Q900,370 1050,400 L1050,500 L-50,500 Z" fill="#1565C0"/>
    <path d="M-50,430 Q150,410 250,435 Q350,455 450,425 Q550,400 650,430 Q750,455 850,425 Q950,405 1050,430 L1050,500 L-50,500 Z" fill="#0D47A1"/>
  </g>

  <!-- The research vessel Aegis - dramatic silhouette on the water -->
  <g transform="translate(380, 380)" opacity="0.25">
    <!-- Hull -->
    <path d="M-30,20 L-50,30 Q-40,40 0,42 Q120,42 180,30 L160,20 Z" fill="#1a3050" stroke="#4FC3F7" stroke-width="0.5" opacity="0.8"/>
    <!-- Cabin -->
    <rect x="20" y="-10" width="80" height="30" fill="#0a1a30" stroke="#4FC3F7" stroke-width="0.5" opacity="0.6" rx="2"/>
    <!-- Mast/antenna -->
    <line x1="60" y1="-10" x2="60" y2="-60" stroke="#4FC3F7" stroke-width="1" opacity="0.5"/>
    <circle cx="60" cy="-62" r="3" fill="#FFD700" opacity="0.6" filter="url(#softGlow)"/>
    <!-- Radar dish -->
    <line x1="45" y1="-55" x2="75" y2="-55" stroke="#4FC3F7" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Water surface reflection glow from vessel -->
  <ellipse cx="500" cy="450" rx="150" ry="40" fill="#FFD700" opacity="0.04" filter="url(#medGlow)"/>

  <!-- Underwater glow - the anomaly (the "unnaturally still" sea) -->
  <ellipse cx="500" cy="750" rx="300" ry="200" fill="#4FC3F7" opacity="0.04" filter="url(#bigGlow)"/>
  <circle cx="500" cy="750" r="80" fill="#E0F7FA" opacity="0.06" filter="url(#medGlow)"/>

  <!-- Deep underwater layers -->
  <g opacity="0.06">
    <ellipse cx="300" cy="900" rx="200" ry="15" fill="#1565C0"/>
    <ellipse cx="600" cy="1000" rx="250" ry="12" fill="#0D47A1"/>
    <ellipse cx="400" cy="1100" rx="180" ry="10" fill="#1565C0"/>
    <ellipse cx="700" cy="850" rx="150" ry="10" fill="#0D47A1"/>
  </g>

  <!-- Sonar ring emanating from underwater anomaly -->
  <g opacity="0.08" stroke="#4FC3F7" fill="none">
    <circle cx="500" cy="750" r="60" stroke-width="1.5"/>
    <circle cx="500" cy="750" r="110" stroke-width="1"/>
    <circle cx="500" cy="750" r="170" stroke-width="0.7"/>
    <circle cx="500" cy="750" r="240" stroke-width="0.5"/>
    <circle cx="500" cy="750" r="320" stroke-width="0.3"/>
  </g>

  <!-- Greek meander border - top and bottom -->
  <g opacity="0.15" stroke="#FFD700" stroke-width="1.2" fill="none">
    <!-- Bottom meander -->
    <path d="M60,1390 h25 v-15 h-12 v10 h25 v-15 h-12 v10 h25 v-15 h-12 v10 h25 v-15 h-12 v10 h25 v-15 h-12 v10 h25 v-15 h-12 v10 h25 v-15 h-12 v10 h25 v-15 h-12 v10 h25 v-15 h-12 v10 h25 v-15 h-12 v10 h25 v-15 h-12 v10 h25 v-15 h-12 v10 h25 v-15 h-12 v10 h25 v-15 h-12 v10 h25 v-15 h-12 v10 h25 v-15 h-12 v10 h25 v-15 h-12 v10 h25 v-15" transform="translate(0,10)"/>
    <!-- Simplified version: just a line with small vertical ticks -->
  </g>

  <!-- Simplified meander - bottom -->
  <g opacity="0.18" fill="none" stroke="#FFD700" stroke-width="1">
    <rect x="100" y="1380" width="800" height="20" rx="1" stroke-dasharray="12,6,4,6"/>
  </g>

  <!-- Greek key ornament - top -->
  <g opacity="0.15" fill="none" stroke="#FFD700" stroke-width="1">
    <rect x="100" y="70" width="800" height="20" rx="1" stroke-dasharray="12,6,4,6"/>
  </g>

  <!-- Side decorative lines -->
  <line x1="50" y1="90" x2="50" y2="1370" stroke="#4FC3F7" stroke-width="0.3" opacity="0.15"/>
  <line x1="950" y1="90" x2="950" y2="1370" stroke="#4FC3F7" stroke-width="0.3" opacity="0.15"/>

  <!-- Title section -->
  <!-- "THE" small -->
  <text x="500" y="980" text-anchor="middle" font-family="'Optima', 'Gill Sans', 'Trebuchet MS', sans-serif" font-size="24" fill="#4FC3F7" letter-spacing="14" opacity="0.45">T H E</text>

  <!-- "ODYSSEY" large -->
  <text x="500" y="1080" text-anchor="middle" font-family="'Optima', 'Gill Sans', 'Trebuchet MS', sans-serif" font-size="80" fill="url(#titleBlue)" filter="url(#glow)" letter-spacing="6">ODYSSEY</text>

  <!-- "PROTOCOL" -->
  <text x="500" y="1165" text-anchor="middle" font-family="'Optima', 'Gill Sans', 'Trebuchet MS', sans-serif" font-size="52" fill="#81D4FA" letter-spacing="18" opacity="0.75" filter="url(#softGlow)">PROTOCOL</text>

  <!-- Gold separator line -->
  <line x1="200" y1="1240" x2="800" y2="1240" stroke="url(#goldLine)" stroke-width="1.5"/>
  <!-- Center diamond -->
  <polygon points="500,1233 507,1240 500,1247 493,1240" fill="#FFD700" opacity="0.5" filter="url(#softGlow)"/>

  <!-- Author -->
  <text x="500" y="1310" text-anchor="middle" font-family="'Optima', 'Gill Sans', 'Trebuchet MS', sans-serif" font-size="18" fill="#7BA7BC" letter-spacing="6" opacity="0.55">MIKE VALASEK</text>

  <!-- Bottom tagline -->
  <text x="500" y="1430" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#4FC3F7" font-style="italic" opacity="0.2">"The sea went impossibly still."</text>
</svg>