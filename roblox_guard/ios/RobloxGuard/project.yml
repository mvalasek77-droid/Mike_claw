# Generate RobloxGuard.xcodeproj with XcodeGen: `xcodegen generate`
#
# RobloxGuard.xcodeproj is intentionally NOT committed — it's generated from
# this file, both locally and in CI (ci_scripts/ci_post_clone.sh runs
# `xcodegen generate` on every Xcode Cloud build so the project can never
# drift from project.yml). To bootstrap Xcode Cloud for the first time you
# must generate + commit the .xcodeproj once locally, since Xcode Cloud's
# workflow setup needs a project file already in the repo to detect and
# select — after that first commit, later changes only need project.yml.
name: RobloxGuard
options:
  bundleIdPrefix: com.mikeclaw
  deploymentTarget:
    iOS: "17.0"
targets:
  RobloxGuard:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: RobloxGuard
        # Parent-facing utility; NOT a Kids Category app (see README).
        PRODUCT_BUNDLE_IDENTIFIER: com.mikeclaw.robloxguard
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: RobloxGuard App Store
        CODE_SIGN_IDENTITY: Apple Distribution
        DEVELOPMENT_TEAM: UDM4W27W9V
        SWIFT_VERSION: "5.9"
        # Local dev talks to http://localhost:8000; production must use HTTPS
        # (no ATS exceptions shipped in release builds).
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        RG_API_BASE_URL: ""
        RG_API_TOKEN: ""

        # Sources/Assets.xcassets/AppIcon.appiconset — original shield + block
        # mark, not derived from Roblox's own logo/branding (see README).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Push Notifications capability restored — distribution profile ZD53Q938HN
    # includes aps-environment production.
    entitlements:
      path: RobloxGuard.entitlements
      properties:
        aps-environment: production
    scheme:
      storeKitConfiguration: RobloxGuard.storekit
      testTargets:
        - RobloxGuardUITests

  RobloxGuardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: RobloxGuard.storekit
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RobloxGuard
        BUNDLE_LOADER: ''
        TEST_HOST: ''
    dependencies:
      - target: RobloxGuard

    # StoreKit 2 subscriptions (PurchaseManager.swift, PaywallView.swift) use
    # RobloxGuard.storekit through the generated shared scheme. Real product
    # IDs must also exist in App Store Connect before release (see README
    # "Pricing").
