# Fly.io configuration for RobloxGuard backend
app = "robloxguard-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[http_service.concurrency]
  type = "requests"
  hard_limit = 25
  soft_limit = 20

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "robloxguard_data"
  destination = "/data"

[env]
  RG_APNS_SANDBOX = "0"
  RG_SUPPORT_EMAIL = "mvalasek@gmail.com"
  RG_DB_PATH = "/data/roblox_guard.db"