app = "robloxguard-api"
primary_region = "iad"

[build]

[env]
  RG_DB_PATH = "/data/roblox_guard.db"
  RG_LOG_DIR = "/data/logs"
  RG_EVIDENCE_DIR = "/data/evidence"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[mounts]
  source = "rg_data"
  destination = "/data"
