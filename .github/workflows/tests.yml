name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-pytest:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r genie_swarm/requirements.txt
          # Pull in test-only deps not listed in the runtime requirements
          pip install pytest pytest-asyncio httpx

      - name: Run pytest
        working-directory: backend
        run: pytest -q

  swift-logic:
    name: Swift logic tests
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # The app's rules, compiled and tested without a simulator.
      - name: Run logic tests
        working-directory: ios/CodeGenieLogic
        run: swift test

      # Every Swift file must at least parse. This replaces a
      # brace-counting check that let real syntax errors through.
      - name: Parse every Swift file
        run: |
          find ios/CodeGenie ios/CodeGenieUITests -name '*.swift' -print0 \
            | xargs -0 swiftc -frontend -parse

  ios-build:
    name: iOS app builds
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      # A real compile of the app and its UI tests. Nothing else in
      # this pipeline type-checks the SwiftUI code.
      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project CodeGenie.xcodeproj \
            -scheme CodeGenie \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 200
