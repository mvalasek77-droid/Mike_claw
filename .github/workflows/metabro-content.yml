name: MetaBro Content Engine

# Keeps the backend feed constantly fresh: regenerates every user + Bro-hood
# avatar AND a fresh feed of posts on a rolling schedule. The content generator
# seeds on the current hour slot, so every run yields a new feed. Commits the
# refreshed assets back to the branch when they change.
#
# NOTE: GitHub only fires `schedule`/`workflow_dispatch` for workflows on the
# repo's DEFAULT branch. Make this branch the default (or trigger manually) for
# the cron to run.
on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch:        # manual trigger

concurrency:
  group: metabro-avatars
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer
        run: pip install cairosvg

      - name: Regenerate avatars, previews + content
        working-directory: tools/metabro_assets
        run: |
          python generate_avatars.py
          python generate_gallery.py
          python generate_content.py
        # To use a real image model instead of the procedural backend, set repo
        # secrets and pass them through here, e.g.:
        #   env:
        #     METABRO_IMAGE_API_URL: ${{ secrets.METABRO_IMAGE_API_URL }}
        #     METABRO_IMAGE_API_KEY: ${{ secrets.METABRO_IMAGE_API_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "metabro-bot"
          git config user.email "metabro-bot@users.noreply.github.com"
          paths="MetaBro/Branding/avatars MetaBro/Branding/previews MetaBro/Branding/content"
          if [ -n "$(git status --porcelain $paths)" ]; then
            git add $paths
            git commit -m "chore(content): refresh ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No content changes today."
          fi
