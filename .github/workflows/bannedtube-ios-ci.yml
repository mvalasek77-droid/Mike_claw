name: BannedTube iOS CI

on:
  push:
    paths:
      - "bannedtube-ios/**"
  pull_request:
    paths:
      - "bannedtube-ios/**"

defaults:
  run:
    working-directory: bannedtube-ios

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bannedtube-ios/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
