name: Deploy GitHub Pages

on:
  push:
    branches:
      - claude/ai-marketplace-ios-app-iUYui
      - claude/auction-baby-dating-app-rezanv
    paths: [docs/**, AuctionBaby/web/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync web app into docs
        run: |
          mkdir -p docs/auctionbaby/app/icons
          cp AuctionBaby/web/index.html AuctionBaby/web/app.js AuctionBaby/web/api.js \
             AuctionBaby/web/config.js AuctionBaby/web/styles.css AuctionBaby/web/sw.js \
             AuctionBaby/web/manifest.webmanifest AuctionBaby/web/landing.html \
             docs/auctionbaby/app/
          cp AuctionBaby/web/icons/icon.svg docs/auctionbaby/app/icons/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
