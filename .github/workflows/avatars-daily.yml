name: MetaBro Daily Content

# Regenerates every user + Bro-hood avatar AND a fresh feed of posts each day.
# Generators seed on the current date, so avatars morph and content rotates
# automatically. Commits the refreshed assets back to the branch when they change.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:       # manual trigger

concurrency:
  group: metabro-avatars
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer
        run: pip install cairosvg

      - name: Regenerate avatars, previews + content
        working-directory: tools/metabro_assets
        run: |
          python generate_avatars.py
          python generate_gallery.py
          python generate_content.py
        # To use a real image model instead of the procedural backend, set repo
        # secrets and pass them through here, e.g.:
        #   env:
        #     METABRO_IMAGE_API_URL: ${{ secrets.METABRO_IMAGE_API_URL }}
        #     METABRO_IMAGE_API_KEY: ${{ secrets.METABRO_IMAGE_API_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "metabro-bot"
          git config user.email "metabro-bot@users.noreply.github.com"
          paths="MetaBro/Branding/avatars MetaBro/Branding/previews MetaBro/Branding/content"
          if [ -n "$(git status --porcelain $paths)" ]; then
            git add $paths
            git commit -m "chore(content): daily refresh ($(date -u +%Y-%m-%d))"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No content changes today."
          fi
