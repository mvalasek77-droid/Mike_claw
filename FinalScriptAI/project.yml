name: FinalScript

options:
  bundleIdPrefix: com.finalscriptai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""

targets:
  FinalScript:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FinalScript
    info:
      path: FinalScript/Resources/Info.plist
      properties:
        CFBundleDisplayName: Final Script AI
        CFBundleName: Final Script AI
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIUserInterfaceStyle: Automatic
        NSPhotoLibraryAddUsageDescription: Save exported title pages and script PDFs to your Photos library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.finalscriptai.app
        PRODUCT_NAME: FinalScript
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_COMPILATION_MODE: wholemodule

schemes:
  FinalScript:
    build:
      targets:
        FinalScript: all
    run:
      config: Debug
    archive:
      config: Release
