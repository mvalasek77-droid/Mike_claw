name: ScreenshotStudio

options:
  bundleIdPrefix: com.screenshotstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: "UDM4W27W9V"

targets:
  ScreenshotStudio:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScreenshotStudio
    info:
      path: ScreenshotStudio/Resources/Info.plist
      properties:
        CFBundleDisplayName: ASC Screenshot Creator
        CFBundleName: ScreenshotStudio
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "3"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSPhotoLibraryAddUsageDescription: Screenshot Studio saves your finished App Store screenshots to a dedicated album in Photos so you can upload them to App Store Connect.
        NSPhotoLibraryUsageDescription: Screenshot Studio saves your finished App Store screenshots into a dedicated “Screenshot Studio” album in Photos so you can find and upload them to App Store Connect.
        UILaunchScreen:
          UIColorName: AccentColor
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valasek.screenshotstudio
        PRODUCT_NAME: ScreenshotStudio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_COMPILATION_MODE: wholemodule

  ScreenshotStudioTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScreenshotStudioTests
    dependencies:
      - target: ScreenshotStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valasek.screenshotstudio.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ScreenshotStudio.app/ScreenshotStudio"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ScreenshotStudio:
    build:
      targets:
        ScreenshotStudio: all
        ScreenshotStudioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScreenshotStudioTests
    archive:
      config: Release
